# Home (I-Interficie; Fase H). Textos editoriales; los productos salen de Medusa
# (Collection `destacados.coleccion` y Price Lists de tipo sale para las ofertas).
# - `hero` y `categorias` son obligatorios; el resto, opcional: si quitas un bloque, no sale.
# - `orden`: los bloques se pintan de menor a mayor (el hero, siempre el primero). Sin repetir.
# - `categorias.handles`: categorías de cualquier nivel (raíz, intermedia u hoja), en este orden.
#   Foto: la propia de la categoría (Admin → categoría → «Foto») o la de su primer producto.
- id: home
  hero:
    antetitulo: Especialistas en perros (y gatos)
    titulo: Lo mejor para tu perro, aunque no sea lo más caro
    texto: Comida y accesorios que probamos y recomendamos de verdad. Si algo no es bueno para tu perro o tu gato, te lo diremos.
    cta:
      texto: Ver la tienda
      enlace: /productos/
    # Provisional: el logo hasta tener foto del hero (src/assets/hero/…)
    imagen: ../assets/marca/logo.png
    imagenAlt: Ilustración de Hiro, el border collie de la tienda
  categorias:
    orden: 1
    titulo: Categorías
    handles: [perro, alimentacion-perro, ropa-perro, para-ti]
  destacados:
    orden: 2
    titulo: Nuestros favoritos
    coleccion: destacados
    maximo: 12
  novedades:
    orden: 3
    titulo: Novedades
    # Nuevos de los últimos `dias` (y no antes de `desde`: la carga inicial del catálogo no
    # cuenta) o con la etiqueta «novedad» en Medusa.
    dias: 30
    maximo: 12
  colecciones:
    orden: 4
    titulo: Colecciones
    handles: [destacados]
  ofertas:
    orden: 5
    titulo: Ofertas de temporada
    texto: Precios rebajados por tiempo limitado en productos que ya conoces.
    cta: Ver ofertas
  etiquetas:
    orden: 6
    titulo: Busca por…
    valores: [sin cereales, hipoalergénico, natural, ideal para regalo]
  valores:
    orden: 7
    titulo: Cómo trabajamos
    items:
      - icono: heart
        titulo: Te recomendamos lo mejor, aunque perdamos la venta
        texto: Si lo que buscas no es lo que tu perro o tu gato necesita, te lo decimos y te orientamos hacia lo que sí le conviene.
      - icono: heart
        titulo: Te recomendamos lo mejor 2, aunque perdamos la venta
        texto: Si lo que buscas no es lo que tu perro o tu gato necesita, te lo decimos y te orientamos hacia lo que sí le conviene.
      - icono: seal-check
        titulo: Calidad sin atajos
        texto: Rechazamos productos y pedidos que no llegan a nuestro estándar. Preferimos vender menos y vender bien.
      - icono: paw-print
        titulo: Hechos por y para perreros
        texto: Somos un equipo pequeño que convive con perros y gatos. Probamos lo que vendemos antes de ponerlo en la tienda.
