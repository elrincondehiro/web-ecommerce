# Pila de PRODUCCIÓN (fase 10; despliegue en el VPS: fase 11). Variables en docker/.env.prod
# (desde docker/.env.prod.example, nunca versionado):
#
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml pull
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml up -d --wait
#
# - Solo Caddy publica puertos (443). El resto, en la red interna del proyecto, sin puertos.
# - backend-server y backend-worker: MISMA imagen (MEDUSA_WORKER_MODE). Solo el server migra.
# - Imágenes: ${REGISTRY}/${IMAGE_NAMESPACE}/ecommerce-<app>:${IMAGE_TAG} (GHCR o Gitea). Los
#   `build:` permiten la alternativa "build en el VPS" (README §11).
# - Tags completos y fijos (README §4.2); prohibido `:latest` (AGENTS §6).
# Fuentes: AGENTS §6, README §11, context7 /medusajs/medusa (deployment/general, worker-mode).
name: web-ecommerce

x-backend: &backend
  image: ${REGISTRY:?}/${IMAGE_NAMESPACE:?}/ecommerce-backend:${IMAGE_TAG:?}
  build:
    context: ..
    dockerfile: apps/backend/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_healthy
  # Variables comunes de server y worker. El worker es el que procesa eventos y jobs: indexado de
  # Meilisearch, emails, limpieza de carritos… así que necesita TODAS las de los proveedores.
  environment: &backend-env
    NODE_ENV: production
    MEDUSA_DISABLE_TELEMETRY: "true"
    # Postgres del compose sin TLS: sin `sslmode=disable` Medusa intenta SSL con todo host que no
    # sea localhost (@medusajs/utils load-module-database-config).
    DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?}
    COOKIE_SECRET: ${COOKIE_SECRET:?}
    STORE_CORS: ${STORE_CORS:?}
    ADMIN_CORS: ${ADMIN_CORS:?}
    AUTH_CORS: ${AUTH_CORS:?}
    STOREFRONT_URL: ${STOREFRONT_URL:?}
    # Ficheros: R2 en producción (en la prueba local, SeaweedFS de compose.prod.local.yml)
    S3_ENDPOINT: ${S3_ENDPOINT:?}
    S3_REGION: ${S3_REGION:-auto}
    S3_BUCKET: ${S3_BUCKET:?}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    S3_FILE_URL: ${S3_FILE_URL:?}
    S3_PREFIX: ${S3_PREFIX:-}
    # Stripe (opcional hasta tener las claves; sin ellas Medusa arranca sin el proveedor)
    STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    # Búsqueda: key PROPIA del backend (no la master), fase10.md §2
    MEILISEARCH_HOST: http://meilisearch:7700
    MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:?}
    SEARCH_STOCK_SYNC_CRON: ${SEARCH_STOCK_SYNC_CRON:-*/5 * * * *}
    # Caché de consultas de Medusa en Redis (Fase R-2, experimental; faseR-rendimiento.md)
    MEDUSA_FF_CACHING: ${MEDUSA_FF_CACHING:-true}
    MEDUSA_CACHE_TTL: ${MEDUSA_CACHE_TTL:-60}
    # Limpieza de carritos (fase 10-4): el job solo corre en el worker
    CART_CLEANUP_DAYS: ${CART_CLEANUP_DAYS:-30}
    CART_CLEANUP_CRON: ${CART_CLEANUP_CRON:-0 3 * * *}
    # Puntos (Fase L-2): abono diario (job del worker) a los N días del último envío
    POINTS_ACCRUE_CRON: ${POINTS_ACCRUE_CRON:-0 4 * * *}
    POINTS_CONSOLIDATE_DAYS: ${POINTS_CONSOLIDATE_DAYS:-14}
    # Fase G: ventana del abono y puntos de los pedidos de invitado pasados a la cuenta
    POINTS_ACCRUE_LOOKBACK_DAYS: ${POINTS_ACCRUE_LOOKBACK_DAYS:-120}
    POINTS_RETROACTIVE: ${POINTS_RETROACTIVE:-true}
    # Fase G-2: caducidad de las solicitudes de transferencia de pedidos (job del worker)
    ORDER_TRANSFER_TTL_DAYS: ${ORDER_TRANSFER_TTL_DAYS:-7}
    ORDER_TRANSFER_EXPIRE_CRON: ${ORDER_TRANSFER_EXPIRE_CRON:-15 4 * * *}
    # Emails
    EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:?}
    EMAIL_FROM: ${EMAIL_FROM:?}
    EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-1025}
    EMAIL_ASSETS_URL: ${EMAIL_ASSETS_URL:-}
    SHOP_NOTIFY_EMAIL: ${SHOP_NOTIFY_EMAIL:-}
    # Aviso de pedido nuevo (Fase M): email a SHOP_NOTIFY_EMAIL + push ntfy (sin datos personales).
    # Sin NTFY_URL/NTFY_ORDERS_TOPIC no hay push. ADMIN_URL = origen del Admin (enlace del aviso).
    ADMIN_URL: ${ADMIN_URL:-}
    NTFY_URL: ${NTFY_URL:-}
    NTFY_ORDERS_TOPIC: ${NTFY_ORDERS_TOPIC:-}
    NTFY_TOKEN: ${NTFY_TOKEN:-}
    # Transferencia (Fase PG-3): sin IBAN/titular no se ofrece.
    TRANSFER_IBAN: ${TRANSFER_IBAN:-}
    TRANSFER_HOLDER: ${TRANSFER_HOLDER:-}
    TRANSFER_DAYS: ${TRANSFER_DAYS:-3}
    TRANSFER_CANCEL_CRON: ${TRANSFER_CANCEL_CRON:-0 9 * * *}
    # Caja de snacks (Fase CS-4): aceptación automática, aviso de horas laborables y festivos.
    CAJA_AUTOACCEPT_HOURS: ${CAJA_AUTOACCEPT_HOURS:-24}
    CAJA_ALERT_WORK_HOURS: ${CAJA_ALERT_WORK_HOURS:-48}
    CAJA_FESTIVOS: ${CAJA_FESTIVOS:-}
    CAJA_JOBS_CRON: ${CAJA_JOBS_CRON:-*/15 * * * *}
    # Comunicaciones (Fase MK-A): firma de los enlaces de baja de los emails comerciales.
    COMMS_UNSUBSCRIBE_SECRET: ${COMMS_UNSUBSCRIBE_SECRET:?}
    # Avisos de stock (Fase MK-B): caducidad (días, 30–730) y jobs del worker.
    STOCK_ALERT_TTL_DAYS: ${STOCK_ALERT_TTL_DAYS:-180}
    STOCK_ALERT_CRON: ${STOCK_ALERT_CRON:-*/5 * * * *}
    STOCK_ALERT_EXPIRE_CRON: ${STOCK_ALERT_EXPIRE_CRON:-30 4 * * *}
    # Cumpleaños de «Mis peques» (Fase MK-D): job del worker (hora UTC).
    PETS_BIRTHDAY_CRON: ${PETS_BIRTHDAY_CRON:-0 9 * * *}
    # Publicar el catálogo (fase 13): secreto compartido con el homelab y minutos sin cambios.
    STOREFRONT_REBUILD_SECRET: ${STOREFRONT_REBUILD_SECRET:-}
    STOREFRONT_REBUILD_QUIET_MIN: ${STOREFRONT_REBUILD_QUIET_MIN:-10}
    # Búsquedas (Fase MK-E2): borrado de los contadores de más de 52 semanas (worker).
    SEARCH_LOG_PURGE_CRON: ${SEARCH_LOG_PURGE_CRON:-45 4 * * *}

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # Solo 443/tcp: con Full (strict) Cloudflare siempre llega al origen por https (el paso de
    # http a https lo hace Cloudflare) y sin HTTP/3 (443/udp). El firewall de Hetzner solo abre
    # 443/tcp a los rangos de Cloudflare (fase 11-1/11-3).
    ports:
      - "443:443"
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      STATS_DOMAIN: ${STATS_DOMAIN:-stats.localhost}
      # cloudflare: Origin CA + mTLS de Cloudflare (AOP de zona) · internal: prueba local (fase 10)
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-cloudflare}
      # noindex: X-Robots-Tag en la tienda (entorno de prueba) · index: tienda abierta
      ROBOTS: ${ROBOTS:-noindex}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # origin.pem, origin.key y aop-ca.pem (fase11.md §4.3). Fuera de git (docker/certs/).
      - ${CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - backend-server

  backend-server:
    <<: *backend
    # Store API SOLO por WireGuard (fase 13): la leen el build del storefront del runner de Gitea
    # del homelab y el del portátil, y el temporizador pregunta /hooks/storefront-rebuild. El
    # firewall de Hetzner no abre el 19000 y 10.77.0.1 no existe fuera del túnel (Docker arranca
    # después de wg-quick@wg0, fase11 §4.9). Sustituye a compose.prod.build.yml.
    ports:
      - "${WG_BIND:-10.77.0.1}:19000:9000"
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"

  backend-worker:
    <<: *backend
    depends_on:
      backend-server:
        condition: service_healthy
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"

  storefront:
    # STOREFRONT_IMAGE_TAG=live: la que publica el rebuild automático (fase 13). Sin ella, IMAGE_TAG.
    image: ${REGISTRY:?}/${IMAGE_NAMESPACE:?}/ecommerce-storefront:${STOREFRONT_IMAGE_TAG:-${IMAGE_TAG:?}}
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      # El build lee el catálogo de la API pública (STOREFRONT_BUILD_BACKEND_URL); no ve la red
      # interna del compose (en la prueba local: compose.prod.local.yml, red `host`).
      args:
        SITE_URL: ${SITE_URL:?}
        IMAGE_BASE_URL: ${IMAGE_BASE_URL:?}
        MEDUSA_BACKEND_URL: ${STOREFRONT_BUILD_BACKEND_URL:-}
        STOREFRONT_MAX_PRODUCTS: ${STOREFRONT_MAX_PRODUCTS:-}
        UMAMI_URL: ${UMAMI_URL:-}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      secrets:
        - medusa_publishable_key
        - astro_key
    restart: unless-stopped
    environment:
      MEDUSA_BACKEND_URL: http://backend-server:9000
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:?}
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      COOKIE_SECURE: "true"

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
      # production: master key obligatoria (≥ 16 bytes) y sin la interfaz de búsqueda de prueba.
      # Sin MEILI_UPGRADE_DB: en producción, snapshot + subida de versión controlada.
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7700/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Analítica Umami (Fase MK-E): BD `umami` y usuario propios en el mismo Postgres (los crea
  # umami-db-init si no existen), memoria limitada, solo red interna (Caddy: STATS_DOMAIN).
  umami-db-init:
    image: postgres:17.11-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$UMAMI_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE umami LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami')\gexec
        ALTER ROLE umami PASSWORD :'pw';
        SELECT 'CREATE DATABASE umami OWNER umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')\gexec
        SQL

  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    restart: unless-stopped
    init: true
    mem_limit: 512m
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/heartbeat || curl -fs http://127.0.0.1:3000/api/heartbeat",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

secrets:
  medusa_publishable_key:
    environment: MEDUSA_PUBLISHABLE_KEY
  astro_key:
    environment: ASTRO_KEY

volumes:
  pgdata:
  redisdata:
  meilidata:
  caddy_data:
  caddy_config:
