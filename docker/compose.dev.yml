# Infraestructura LOCAL de desarrollo. Las apps (Medusa, Astro) corren en el host con `pnpm dev`.
# Versiones fijadas en README §4.2 — prohibido `:latest`.
# Uso: pnpm infra:up | infra:down | infra:ps | infra:logs | infra:stripe
name: web-ecommerce-dev

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      # Solo dev: migra la BD al subir de versión (Renovate). En prod: snapshot + upgrade controlado.
      MEILI_UPGRADE_DB: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:7700/health || wget -qO- http://localhost:7700/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 local (imita Cloudflare R2). `weed mini` = master + volume + filer + S3 + admin UI.
  # Credenciales y bucket se crean al arrancar vía AWS_* / S3_BUCKET.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333" # API S3
      - "127.0.0.1:${SEAWEED_ADMIN_PORT:-23646}:23646" # Admin UI
    volumes:
      - seaweeddata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8333/healthz >/dev/null 2>&1 || wget -qO- http://localhost:9333/cluster/status >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Captura de emails en local (SMTP :1025, UI :8025)
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # Reenvío de webhooks de Stripe al backend local. Solo con: pnpm infra:stripe
  # Eventos: los 4 que procesa el proveedor Stripe de Medusa (fase 5, docs Medusa payment-stripe).
  # El whsec_ para STRIPE_WEBHOOK_SECRET (apps/backend/.env):
  #   docker compose --env-file docker/.env -f docker/compose.dev.yml run --rm stripe-cli listen --print-secret
  stripe-cli:
    image: stripe/stripe-cli:v1.53.1
    profiles: ["stripe"]
    command:
      - listen
      - --events
      - payment_intent.amount_capturable_updated,payment_intent.succeeded,payment_intent.payment_failed,payment_intent.partially_funded
      - --forward-to
      - http://host.docker.internal:9000/hooks/payment/stripe_stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:
  meilidata:
  seaweeddata:
