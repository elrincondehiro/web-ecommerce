# Monitorización en el HOMELAB (fase 11-8): VM `monitor-kbd` (Debian 13 + Docker), fuera del VPS.
# Si el VPS cae, esto lo ve y avisa (README §12). Interfaces SOLO en la LAN (10.0.10.230) y por el
# WireGuard del homelab: nada se publica a Internet. Hacia el VPS: túnel WireGuard (10.77.0.3 →
# 10.77.0.1), sin abrir puertos en el router.
#
#   cd /opt/monitor && ./dcm up -d
#   (`dcm`: docker compose --env-file monitor.env -f compose.homelab.yml con el entorno vacío)
#
# - Uptime Kuma (:3001): disponibilidad (tienda/api/admin por Cloudflare), certificado, heartbeat
#   del backup (push), alertas por email (Resend) y ntfy.
# - Beszel hub (:8090): métricas de host y contenedores del VPS y de la VM (agente en modo SSH:
#   el hub conecta a 10.77.0.1:45876 por el túnel).
# - Dozzle (:8080): logs de los contenedores del VPS (agente en 10.77.0.1:7007, TLS con
#   certificado propio en ./dozzle-certs) y de esta VM (socket local).
# Tags fijos (AGENTS §6). Fuentes: context7 /louislam/uptime-kuma-wiki (How-to-Install: /app/data),
# /henrygd/beszel-docs (hub-installation, agent-installation, security), /amir20/dozzle (agent:
# DOZZLE_REMOTE_AGENT, certificados). docs/fases/fase11.md §4.9.
name: monitor

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.7
    restart: unless-stopped
    # LAN (interfaz) y la IP del túnel WireGuard: el backup del VPS manda su heartbeat (push) a
    # http://10.77.0.3:3001/api/push/… por el túnel.
    ports:
      - "10.0.10.230:3001:3001"
      - "10.77.0.3:3001:3001"
    volumes:
      - kuma:/app/data

  beszel:
    image: henrygd/beszel:0.21.1
    restart: unless-stopped
    environment:
      APP_URL: http://10.0.10.230:8090
    ports:
      - "10.0.10.230:8090:8090"
    volumes:
      - beszel:/beszel_data
      - beszel-socket:/beszel_socket

  # Agente de Beszel de la propia VM (por socket con el hub, sin red)
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://10.0.10.230:8090
      KEY: ${BESZEL_KEY:-}
      TOKEN: ${BESZEL_TOKEN_VM:-}

  dozzle:
    image: amir20/dozzle:v11.3.5
    restart: unless-stopped
    environment:
      # Agente del VPS por el túnel; `|nombre` = cómo sale en la interfaz
      DOZZLE_REMOTE_AGENT: 10.77.0.1:7007|vps-hetzner
      DOZZLE_HOSTNAME: monitor-kbd
      DOZZLE_NO_ANALYTICS: "true"
      # Login con usuario y contraseña (./dozzle-data/users.yml, generado con `dozzle generate`).
      # Sin acciones (start/stop) ni shell: solo leer logs.
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "10.0.10.230:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-data:/data
    secrets:
      - source: dozzle_cert
        target: /dozzle_cert.pem
      - source: dozzle_key
        target: /dozzle_key.pem

secrets:
  dozzle_cert:
    file: ./dozzle-certs/dozzle_cert.pem
  dozzle_key:
    file: ./dozzle-certs/dozzle_key.pem

volumes:
  kuma:
  beszel:
  beszel-socket:
  beszel-agent:
