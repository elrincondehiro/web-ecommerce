# Monitorización en el HOMELAB (fase 11-8): VM `monitor-kbd` (Debian 13 + Docker), fuera del VPS.
# Si el VPS cae, esto lo ve y avisa (README §12). Interfaces SOLO en la LAN (10.0.10.230) y por el
# WireGuard del homelab: nada se publica a Internet. Hacia el VPS: túnel WireGuard (10.77.0.3 →
# 10.77.0.1), sin abrir puertos en el router.
#
#   cd /opt/monitor && ./dcm up -d
#   (`dcm`: docker compose --env-file monitor.env -f compose.homelab.yml con el entorno vacío)
#
# - Uptime Kuma (:3001): disponibilidad (tienda/api/admin por Cloudflare), certificado, heartbeat
#   del backup (push), alertas por email (Resend) y ntfy.
# - Beszel hub (:8090): métricas de host y contenedores del VPS y de la VM (agente en modo SSH:
#   el hub conecta a 10.77.0.1:45876 por el túnel).
# - Dozzle (:8080): logs de los contenedores del VPS (agente en 10.77.0.1:7007, TLS con
#   certificado propio en ./dozzle-certs) y de esta VM (socket local).
# - Bugsink (:8000, fase 12-B): errores de la aplicación (Medusa y el SSR del storefront, SDK de
#   Sentry). El VPS los envía por el túnel (http://10.77.0.3:8000); panel en la LAN. SQLite en el
#   volumen `bugsink`. Alertas por email (Resend, SMTP) y ntfy (webhook «Custom»).
# Tags fijos (AGENTS §6). Fuentes: context7 /louislam/uptime-kuma-wiki (How-to-Install: /app/data),
# /henrygd/beszel-docs (hub-installation, agent-installation, security), /amir20/dozzle (agent:
# DOZZLE_REMOTE_AGENT, certificados). docs/fases/fase11.md §4.9.
name: monitor

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11
    restart: unless-stopped
    # LAN (interfaz) y la IP del túnel WireGuard: el backup del VPS manda su heartbeat (push) a
    # http://10.77.0.3:3001/api/push/… por el túnel.
    ports:
      - "10.0.10.230:3001:3001"
      - "10.77.0.3:3001:3001"
    volumes:
      - kuma:/app/data

  beszel:
    image: henrygd/beszel:0.21.2
    restart: unless-stopped
    environment:
      APP_URL: http://10.0.10.230:8090
    ports:
      - "10.0.10.230:8090:8090"
    volumes:
      - beszel:/beszel_data
      - beszel-socket:/beszel_socket

  # Agente de Beszel de la propia VM (por socket con el hub, sin red)
  beszel-agent:
    image: henrygd/beszel-agent:0.21.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://10.0.10.230:8090
      KEY: ${BESZEL_KEY:-}
      TOKEN: ${BESZEL_TOKEN_VM:-}

  dozzle:
    image: amir20/dozzle:v11.4.3
    restart: unless-stopped
    environment:
      # Agente del VPS por el túnel; `|nombre` = cómo sale en la interfaz
      DOZZLE_REMOTE_AGENT: 10.77.0.1:7007|vps-hetzner
      DOZZLE_HOSTNAME: monitor-kbd
      DOZZLE_NO_ANALYTICS: "true"
      # Login con usuario y contraseña (./dozzle-data/users.yml, generado con `dozzle generate`).
      # Sin acciones (start/stop) ni shell: solo leer logs.
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "10.0.10.230:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-data:/data
    secrets:
      - source: dozzle_cert
        target: /dozzle_cert.pem
      - source: dozzle_key
        target: /dozzle_key.pem

  # Errores de la aplicación (fase 12-B, docs/fases/fase12.md). Un solo contenedor (web + tareas,
  # `monofy` de la imagen), SQLite en /data. Solo LAN y túnel: nada en Internet, así que sin HTTPS
  # (BEHIND_HTTPS_PROXY=false). Fuente: context7 /websites/bugsink (docker-install, settings,
  # alerts) y bugsink_conf.py de la imagen 2.6.3.
  bugsink:
    image: bugsink/bugsink:2.6.3
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?}
      # Solo crea el usuario si aún no hay ninguno (primer arranque).
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER:?}
      BASE_URL: http://10.0.10.230:8000
      SITE_TITLE: Errores · El Rincón de Hiro
      TIME_ZONE: Europe/Madrid
      # Un usuario y un equipo: sin registro abierto.
      SINGLE_USER: "true"
      SINGLE_TEAM: "true"
      # Alertas por email con Resend (SMTP: smtp.resend.com:465, usuario «resend», la API key).
      EMAIL_HOST: smtp.resend.com
      EMAIL_PORT: "465"
      EMAIL_USE_SSL: "true"
      EMAIL_HOST_USER: resend
      EMAIL_HOST_PASSWORD: ${BUGSINK_RESEND_API_KEY:?}
      DEFAULT_FROM_EMAIL: ${BUGSINK_FROM_EMAIL:?}
      # Tope de eventos (protege el disco si algo entra en bucle); 2 procesos web.
      MAX_EVENTS_PER_PROJECT_PER_HOUR: "1000"
      MAX_EVENT_AGE_DAYS: "90"
      GUNICORN_CMD_ARGS: --workers=2
    ports:
      - "10.0.10.230:8000:8000"
      - "10.77.0.3:8000:8000"
    volumes:
      - bugsink:/data

secrets:
  dozzle_cert:
    file: ./dozzle-certs/dozzle_cert.pem
  dozzle_key:
    file: ./dozzle-certs/dozzle_key.pem

volumes:
  bugsink:
  kuma:
  beszel:
  beszel-socket:
  beszel-agent:
