# CI básico de PR (fase 1). Mismo fichero para Gitea Actions y GitHub Actions.
# - Gitea: runner de usuario en el homelab; la etiqueta `ubuntu-latest` apunta a
#   docker://node:24.21.0-trixie (Debian 13 + Node 24). Ver docs/fases/fase1.md.
# - GitHub: runner hospedado ubuntu-latest.
# Actions fijadas por SHA (tag en comentario); Renovate las actualiza.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sin telemetría de Medusa en CI (decisión P6 fase 2)
  MEDUSA_DISABLE_TELEMETRY: "true"

jobs:
  # Nombre estable: es el check obligatorio en la protección de main (Gitea) y en el ruleset (GitHub).
  # Sin filtros `paths:` → un job saltado no cumple un check obligatorio.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node (.node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
